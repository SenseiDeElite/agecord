<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 1.5 97 97" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Agecord (locked, spinning)</title>
  <defs>
    <linearGradient id="sheen" x1=".2" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <path id="shape" d="M50.00 1.50 L56.33 1.91 L61.19 8.22 L66.55 10.04 L74.25 8.00 L79.52 11.52 L80.58 19.42 L84.31 23.67 L92.00 25.75 L94.81 31.44 L91.78 38.81 L92.88 44.35 L98.50 50.00 L98.09 56.33 L91.78 61.19 L89.96 66.55 L92.00 74.25 L88.48 79.52 L80.58 80.58 L76.33 84.31 L74.25 92.00 L68.56 94.81 L61.19 91.78 L55.65 92.88 L50.00 98.50 L43.67 98.09 L38.81 91.78 L33.45 89.96 L25.75 92.00 L20.48 88.48 L19.42 80.58 L15.69 76.33 L8.00 74.25 L5.19 68.56 L8.22 61.19 L7.12 55.65 L1.50 50.00 L1.91 43.67 L8.22 38.81 L10.04 33.45 L8.00 25.75 L11.52 20.48 L19.42 19.42 L23.67 15.69 L25.75 8.00 L31.44 5.19 L38.81 8.22 L44.35 7.12Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="10s" repeatCount="indefinite"/>

    <use href="#shape" fill="#a491ff">
      <animate attributeName="fill" values="#a491ff;#b9abff;#a491ff" dur="3s" repeatCount="indefinite"/>
    </use>

    <g clip-path="url(#clip)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="-360 50 50" dur="10s" repeatCount="indefinite"/>
        <rect x="1" y="1" width="98" height="98" fill="url(#sheen)"/>
        <g transform="rotate(20 50 50)">
          <rect x="-30" y="-20" width="26" height="140" fill="url(#sweep)">
            <animateTransform attributeName="transform" type="translate" values="0 0;0 0;150 0;150 0" keyTimes="0;0.2;0.7;1" dur="3s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(50 50.6)">
    <g transform="scale(2.95) translate(-12 -12.4)" fill="none" stroke="#1a172c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4.75" y="10.5" width="14.5" height="10.25" rx="3.25" fill="#1a172c" fill-opacity=".28"/>
      <path d="M8 10.5V7.75a4 4 0 0 1 8 0v2.75"/>
      <circle cx="12" cy="15.6" r="1.6" fill="#1a172c" stroke="none"/>
    </g>
  </g>
</svg>
