<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Import Contacts – Agecord</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="seal-rim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/>
      </linearGradient>
      <linearGradient id="seal-sheen" x1=".2" y1="0" x2=".7" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/>
      </linearGradient>
      <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 14.5V4.5M8.25 8.25 12 4.5l3.75 3.75M5 14.5v2.25A2.75 2.75 0 0 0 7.75 19.5h8.5A2.75 2.75 0 0 0 19 16.75V14.5"/>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 12.75 4 4L18.25 8"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round">
        <path d="M12 6.5v7.25"/><circle cx="12" cy="17.75" r="1.2" fill="currentColor" stroke="none"/>
      </symbol>
    </defs>
  </svg>

  <main class="page page-center">
    <div class="page-card">
      <div class="hero">
        <span class="seal seal-lg" id="seal" aria-hidden="true">
          <svg class="seal-shape" viewBox="0 0 100 100"><path class="seal-body"/><path class="seal-sheen"/></svg>
          <svg class="ic glyph g-closed"><use href="#i-upload"/></svg>
          <svg class="ic glyph g-open"><use href="#i-check"/></svg>
          <svg class="ic glyph g-warn"><use href="#i-alert"/></svg>
        </span>
        <h1>Import contacts</h1>
        <p>Select your <strong>Agecord</strong> JSON export file.</p>
      </div>

      <label class="btn btn-block">
        Choose file
        <input id="f" class="sr-only" type="file" accept=".json,application/json">
      </label>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>
  </main>
  <script src="import-helper.js"></script>
</body>
</html>
